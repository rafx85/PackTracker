name: GitHub CI

permissions:
  contents: read

env:
  HDT_VERSION: v1.53.8

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          $expectedTag = "v$($props.Project.PropertyGroup.PackTrackerVersion)"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME must match $expectedTag."
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2.0.0

      - name: Setup HDT
        shell: pwsh
        run: |
          $asset = "Hearthstone.Deck.Tracker-$env:HDT_VERSION.zip"
          Invoke-WebRequest "https://github.com/HearthSim/Hearthstone-Deck-Tracker/releases/download/$env:HDT_VERSION/$asset" -OutFile HDT.zip
          Expand-Archive HDT.zip
          Rename-Item './HDT/Hearthstone Deck Tracker/Hearthstone Deck Tracker.exe' HearthstoneDeckTracker.exe

      - name: Build
        shell: pwsh
        run: |
          dotnet build PackTracker.sln --configuration Release

      - name: Test
        shell: pwsh
        run: |
          dotnet test PackTracker.sln --configuration Release --no-build

      - name: Package and verify updater
        shell: pwsh
        run: |
          $package = .\scripts\package.ps1
          .\scripts\verify-updater.ps1 -PackagePath $package

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: PackTracker
          path: artifacts/PackTracker.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.repository == 'rafx85/PackTracker' && github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PackTracker
          path: ${{ runner.temp }}

      - name: Publish tested package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          asset="$RUNNER_TEMP/PackTracker.zip"
          release="$RUNNER_TEMP/packtracker-release.json"
          test -s "$asset"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets > "$release" 2>/dev/null; then
            jq -e '(.isDraft or .isPrerelease) | not' "$release" >/dev/null
            if ! jq -e '.assets[] | select(.name == "PackTracker.zip")' "$release" >/dev/null; then
              gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
